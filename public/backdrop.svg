<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Site backdrop for the refraction trial. The glass cards receive this
       same file as their refractionBackground, so what they bend matches what
       sits behind them exactly. -->
  <defs>
    <radialGradient id="teal" cx="25%" cy="0%" r="55%">
      <stop offset="0" stop-color="#1d97a3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#1d97a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="92%" cy="78%" r="55%">
      <stop offset="0" stop-color="#7356d4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7356d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#5b8cf5"/>
      <stop offset="1" stop-color="#9b6cf7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0b0e14"/>
  <rect width="1600" height="1000" fill="url(#teal)"/>
  <rect width="1600" height="1000" fill="url(#violet)"/>

  <!-- secondary pale band -->
  <path d="M-120 290 C 380 370, 700 660, 1100 600 S 1520 430, 1720 520"
        fill="none" stroke="#e6f1ff" stroke-opacity=".10" stroke-width="80" stroke-linecap="round"/>

  <!-- main ribbon: glow, body, lit edge -->
  <path d="M-120 830 C 300 800, 520 300, 860 450 S 1320 720, 1720 150"
        fill="none" stroke="url(#ribbon)" stroke-opacity=".55" stroke-width="170" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M-120 830 C 300 800, 520 300, 860 450 S 1320 720, 1720 150"
        fill="none" stroke="url(#ribbon)" stroke-width="130" stroke-linecap="round"/>
  <path d="M-120 772 C 300 742, 520 242, 860 392 S 1320 662, 1720 92"
        fill="none" stroke="#d6fbff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>
</svg>
