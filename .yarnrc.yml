# Yarn 4 config. The exact version lives in package.json ("packageManager"),
# which Corepack reads, so everyone gets yarn 4.10.3 without extra setup.

# Plain node_modules layout: Astro/Vite and the Prettier/ESLint plugins all
# resolve normally, no PnP shims needed.
nodeLinker: node-modules

# Supply-chain guard: refuse any package version published less than 7 days
# ago (value is in minutes). Fresh releases are the window in which a
# compromised or hijacked publish is usually caught and unpublished, so
# waiting a week keeps that class of attack out of installs.
npmMinimalAgeGate: 10080
